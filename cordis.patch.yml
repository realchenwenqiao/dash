# The dsh-tui bundle patch: an interactive terminal front door over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. The runner
# creates one persistent Agent through the core registry, drives it from a
# readline loop, streams committed assistant text to stdout, and flushes the
# session on /exit — the same small stable surface the headless bundle uses.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the other surfaces.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tui-runner
      name: '@realchenwenqiao/dash'
